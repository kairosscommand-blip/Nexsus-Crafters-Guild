# NexusEndeavors configuration.

persistence:
  flush-interval-ticks: 6000 # 5 minutes -- see EndeavorRegistry's own comment on why not every report

# The day/week boundary is UTC by default. Shift it to your server's local midnight here, e.g.
# -5 for US Eastern (so "today" flips over at 5am UTC instead of exactly midnight UTC).
reset:
  utc-offset-hours: 0

# How many objectives from each pool below are "active" at once -- the same set for every player,
# reshuffled deterministically from the day/week index (see DailyBoard).
daily-active-count: 3
weekly-active-count: 2

# Login-streak milestone bonuses. Every day in the streak still shows in /endeavors streak; these
# are the days that additionally pay out a seal bonus on top of the daily board itself.
streak-milestones:
  - day: 3
    seals: 50
  - day: 7
    seals: 150
  - day: 14
    seals: 300
  - day: 30
    seals: 750

# Materials StandaloneObjectiveListener's "mine.ore" key counts as ore. Defaults to iron/diamond
# ore if left empty or every entry is unrecognized.
standalone:
  ore-materials:
    - IRON_ORE
    - DIAMOND_ORE

# --- The daily objective pool -- daily-active-count of these rotate in each day. ---
daily-pool:
  - id: slay-hostiles
    objective-key: kill.hostile
    description: "Slay 15 hostile mobs"
    target: 15
    reward-seals: 40
  - id: prospector
    objective-key: mine.ore
    description: "Mine 20 ore blocks"
    target: 20
    reward-seals: 35
  - id: wanderer
    objective-key: walk.blocks
    description: "Walk 500 blocks"
    target: 500
    reward-seals: 25
  - id: dedicated
    objective-key: playtime.minutes
    description: "Play for 20 minutes"
    target: 20
    reward-seals: 30
  - id: dungeon-delver
    objective-key: dungeon.kill
    description: "Kill 5 mobs inside a NexusDungeons dungeon"
    target: 5
    reward-seals: 60
  - id: forge-work
    objective-key: forge.craft
    description: "Forge 3 items at your Crafters Guild forge"
    target: 3
    reward-seals: 60
  - id: house-tithe
    objective-key: house.donate
    description: "Donate 100 gold to your House treasury"
    target: 100
    reward-seals: 50
  - id: rested-hunter
    objective-key: kill.hostile
    description: "Slay 40 hostile mobs"
    target: 40
    reward-seals: 90

# --- The weekly objective pool -- weekly-active-count of these rotate in each week. ---
weekly-pool:
  - id: weekly-hunter
    objective-key: kill.hostile
    description: "Slay 100 hostile mobs this week"
    target: 100
    reward-seals: 200
  - id: weekly-miner
    objective-key: mine.ore
    description: "Mine 150 ore blocks this week"
    target: 150
    reward-seals: 180
  - id: weekly-smith
    objective-key: forge.craft
    description: "Forge 15 items at your Guild forge this week"
    target: 15
    reward-seals: 250
  - id: weekly-delver
    objective-key: dungeon.kill
    description: "Kill 25 mobs inside dungeons this week"
    target: 25
    reward-seals: 250
  - id: weekly-patron
    objective-key: house.donate
    description: "Donate 500 gold to your House this week"
    target: 500
    reward-seals: 200
  - id: weekly-wanderer
    objective-key: walk.blocks
    description: "Walk 3000 blocks this week"
    target: 3000
    reward-seals: 150

# --- The cosmetics vendor -- spend Endeavor Seals here. Cosmetic-only, on purpose (see README). ---
vendor:
  items:
    - id: guild-banner
      material: BLUE_BANNER
      name: "Guild Banner"
      price-seals: 120
    - id: guild-hat
      material: GOLD_BLOCK
      name: "Guildmaster's Golden Crown (wearable hat -- see NexusHats)"
      price-seals: 400
    - id: emerald-trophy
      material: EMERALD_BLOCK
      name: "Emerald Trophy"
      price-seals: 300
    - id: diamond-trophy
      material: DIAMOND
      name: "Endeavor's Diamond Keepsake"
      price-seals: 500
    - id: red-carpet-bundle
      material: RED_CARPET
      name: "Guild Hall Red Carpet"
      price-seals: 60
    - id: lantern-set
      material: LANTERN
      name: "Guild Lantern"
      price-seals: 40
