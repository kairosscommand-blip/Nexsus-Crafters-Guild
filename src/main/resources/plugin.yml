name: NexusCraftersGuild
version: 1.0.1
main: com.nexuscraft.nexuscraftersguild.NexusCraftersGuild
api-version: '1.21'
author: RealSociety
softdepend: [Vault, NexusEndeavors]
description: A real blacksmithing profession built around the vanilla Auto Crafter -- skill levels, quality-tier gear, placeable forge businesses, and mass-production automation chains -- fused with an ESO-style world of roaming events and standing Guild Contracts, so there is always something the Guild wants done.

commands:
  guild:
    description: The Crafters Guild -- your profession, your forge, world events, and standing contracts.
    usage: /guild <profile|forge|contracts|events> -- admin: <reload>

permissions:
  nexuscraftersguild.admin:
    description: Unclaim any forge and reload NexusCraftersGuild's config.
    default: op
