name: NexusEndeavors
version: 1.0.0
main: com.nexuscraft.nexusendeavors.NexusEndeavors
api-version: '1.21'
author: RealSociety
softdepend: [NexusDungeons, NexusCraftersGuild, NexusHouses]
description: A shared daily/weekly endeavor board pulling from across the whole Nexus family -- kill counts, forged gear, House donations, and more -- paid in Endeavor Seals, spendable at a cosmetics vendor. Plus a login streak, so there's always a reason to log in and do something.

commands:
  endeavors:
    description: The Guild's endeavor board -- daily/weekly objectives, your login streak, and the cosmetics vendor.
    usage: /endeavors <board|streak|vendor> -- admin: <reload>

permissions:
  nexusendeavors.admin:
    description: Reload NexusEndeavors' config.
    default: op
